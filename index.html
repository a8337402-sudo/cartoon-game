<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خمّن الكرتون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ===================== Variables & Base ===================== */
  :root{
    --paper:#FFF6E5;
    --ink:#1B1B1B;
    --pop-red:#E6473C;
    --pop-yellow:#FFC93C;
    --pop-blue:#3D8BD4;
    --pop-green:#4CAF7D;
    --panel-shadow: 6px 6px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background-color: var(--paper);
    background-image: radial-gradient(var(--ink) 1px, transparent 1.2px);
    background-size: 18px 18px;
    background-position: -9px -9px;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction: column;
    align-items:center;
    padding:16px 14px 40px;
  }

  /* ===================== Top Bar ===================== */
  .top-bar {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .sound-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 6px 12px;
    border: 2.5px solid var(--ink);
    border-radius: 10px;
    cursor: pointer;
    background: #fff;
    color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .sound-btn.active {
    background: var(--pop-green);
    color: #fff;
  }

  /* ===================== Auth & Welcome ===================== */
  .app{ width:100%; max-width:440px; }
  
  .auth-hero {
    background: var(--pop-yellow);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 24px 20px;
    text-align: center;
    box-shadow: var(--panel-shadow);
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .auth-hero::before {
    content: "📺 ✨ 🍿";
    position: absolute;
    top: -10px;
    right: -10px;
    font-size: 3rem;
    opacity: 0.15;
  }

  h1.logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:2.4rem;
    text-align:center;
    color:var(--ink);
    margin:0 0 4px;
    letter-spacing:1px;
    text-shadow: 3px 3px 0 #fff;
  }
  h1.logo span{ color:var(--pop-red); }
  
  .tagline{
    text-align:center;
    font-weight:700;
    color: #333;
    margin: 0;
    font-size:0.95rem;
    line-height: 1.5;
  }

  .welcome-banner {
    text-align: center;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 16px;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  /* ===================== Menu ===================== */
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }

  .menu-box-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 14px 10px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    cursor: pointer;
    background: #fff;
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    text-align: center;
    transition: transform .08s ease, box-shadow .08s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .menu-box-btn:active { transform: translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .menu-box-btn.red { background: var(--pop-red); color: #fff; }
  .menu-box-btn.blue { background: var(--pop-blue); color: #fff; }

  /* ===================== Panels & Forms ===================== */
  .panel{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow: var(--panel-shadow);
    padding:20px;
    margin-bottom:18px;
  }
  
  label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
    font-size:0.96rem;
    text-align:right;
  }
  
  input[type=text], input[type=password], textarea{
    width:100%;
    font-family:'Cairo',sans-serif;
    font-size:1.05rem;
    padding:14px 16px;
    border:2.5px solid var(--ink);
    border-radius:12px;
    margin-bottom:16px;
    background:var(--paper);
    box-shadow:3px 3px 0 var(--ink);
    transition: all 0.1s ease;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus{ 
    outline: none;
    border-color: var(--pop-blue);
    background: #fff;
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  
  textarea{ resize:vertical; }
  
  /* ===================== Buttons ===================== */
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    padding:12px 22px;
    border:3px solid var(--ink);
    border-radius:12px;
    cursor:pointer;
    background:var(--pop-yellow);
    color:var(--ink);
    box-shadow:4px 4px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease;
    width:100%;
  }
  .btn:hover{ background: #ffe169; }
  .btn:active{ transform: translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn.red{ background:var(--pop-red); color:#fff; }
  .btn.green{ background:var(--pop-green); color:#fff; }
  .btn.blue{ background:var(--pop-blue); color:#fff; }
  .btn.small{ width:auto; font-size:0.85rem; padding:8px 14px; box-shadow:3px 3px 0 var(--ink); }
  
  /* ===================== Room Badges & Player Chips ===================== */
  .code-badge{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.6rem;
    letter-spacing:4px;
    background:var(--pop-blue);
    color:#fff;
    border:3px solid var(--ink);
    border-radius:10px;
    padding:6px 18px;
    box-shadow:3px 3px 0 var(--ink);
    margin: 8px 0;
  }
  .center{ text-align:center; }
  .players{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; justify-content:center; }
  .chip{
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:20px;
    padding:5px 14px;
    font-weight:700;
    font-size:0.85rem;
  }
  .chip.me{ background:var(--pop-yellow); }
  .divider{ border:none; border-top:2.5px dashed var(--ink); margin:16px 0; opacity:0.5; }
  
  /* ===================== Game Content ===================== */
  .game-img-wrap{
    border:3px solid var(--ink);
    border-radius:14px;
    overflow:hidden;
    margin-bottom:16px;
    background:#eee;
  }
  .game-img-wrap img{ width:100%; display:block; }
  
  .file-drop{
    border:2.5px dashed var(--ink);
    border-radius:14px;
    padding:18px 14px;
    text-align:center;
    font-weight:700;
    cursor:pointer;
    background:var(--paper);
    margin-bottom:14px;
    box-shadow:3px 3px 0 var(--ink);
    font-size:0.95rem;
  }
  .file-drop.has-img{ padding:0; border-style:solid; overflow:hidden; }
  .file-drop.has-img img{ width:100%; display:block; max-height:220px; object-fit:cover; }

  .guess-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:8px;
  }
  .guess-text{ font-weight:700; }
  .guess-text.wrong{ text-decoration:line-through; opacity:0.55; }
  .guess-text.correct{ color:var(--pop-green); }
  .verdict-btns{ display:flex; gap:6px; }
  .badge-tag{
    font-size:0.75rem;
    font-weight:700;
    padding:2px 9px;
    border-radius:10px;
    background:#eee;
    border:1.5px solid var(--ink);
  }
  .waiting-msg{ text-align:center; font-weight:700; color:#666; padding:15px 0; }
  
  /* ===================== Select & Cartoon Picker ===================== */
  select{
    width:100%;
    font-family:'Cairo',sans-serif;
    font-size:1rem;
    padding:12px 14px;
    border:2.5px solid var(--ink);
    border-radius:10px;
    margin-bottom:14px;
    background:var(--paper);
    box-shadow:3px 3px 0 var(--ink);
  }
  
  .cartoon-picks{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .cartoon-chip{
    border:2.5px solid var(--ink);
    border-radius:20px;
    padding:6px 14px;
    font-weight:700;
    font-size:0.85rem;
    cursor:pointer;
    background:#fff;
    box-shadow:3px 3px 0 var(--ink);
    transition: transform .08s ease;
  }
  .cartoon-chip:active{ transform: translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .cartoon-chip.selected{ background:var(--pop-yellow); }

  .desc-card{
    background:#EAF6EF;
    border:2.5px solid var(--pop-green);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
    white-space:pre-wrap;
    font-size:0.88rem;
    line-height:1.6;
    box-shadow:3px 3px 0 var(--ink);
    text-align: right;
  }

  /* ===================== Header Row & Modal ===================== */
  .top-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .modal-box {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 24px;
    width: 90%;
    max-width: 340px;
    text-align: center;
    box-shadow: var(--panel-shadow);
  }
  .modal-box h3 {
    font-family: 'Baloo 2', sans-serif;
    margin-top: 0;
    color: var(--pop-red);
    font-size: 1.5rem;
  }
  .modal-box p {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 20px;
    color: #333;
  }
</style>
</head>
<body onload="initApp()">

<div class="top-bar">
  <button class="sound-btn active" id="soundToggleBtn" onclick="toggleSound()">🔊 المؤثرات: مفعلة</button>
</div>

<div class="app" id="app"></div>
<div id="modalContainer"></div>

<audio id="sfxCorrect" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
<audio id="sfxWrong" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3" preload="auto"></audio>
<audio id="sfxClick" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

<script>
// ===================== Storage Helpers =====================
const memoryFallback = {};
const safeStorage = {
  getItem(key) {
    try { return localStorage.getItem(key); } catch(e) { return memoryFallback[key] || null; }
  },
  setItem(key, val) {
    try { localStorage.setItem(key, val); } catch(e) { memoryFallback[key] = val; }
  },
  removeItem(key) {
    try { localStorage.removeItem(key); } catch(e) { delete memoryFallback[key]; }
  }
};

// ===================== App State =====================
const STORAGE_PREFIX = 'cartoon-room:';
const USER_STORAGE_PREFIX = 'cartoon-user:';
const USERS_DB_KEY = 'cartoon-app-users-db';
let account = null;
let me = null;
let roomCode = null;
let state = null;
let pollTimer = null;
let entryMode = 'create'; 

let setupMode = 'none';
let draftCartoonName = null;
let customImageData = null;
let draftDescription = null;
let customNameInputVal = '';
let customDescInputVal = '';
let soundEnabled = true;

// ===================== Sound Helpers =====================
function playSound(type) {
  if (!soundEnabled) return;
  const audioMap = {
    correct: document.getElementById('sfxCorrect'),
    wrong: document.getElementById('sfxWrong'),
    click: document.getElementById('sfxClick')
  };
  const target = audioMap[type];
  if(target){
    target.currentTime = 0;
    target.play().catch(e => {});
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  playSound('click');
  const btn = document.getElementById('soundToggleBtn');
  if(btn){
    btn.className = soundEnabled ? 'sound-btn active' : 'sound-btn';
    btn.textContent = soundEnabled ? '🔊 المؤثرات: مفعلة' : '🔇 المؤثرات: متوقفة';
  }
}

// ===================== Modal Helpers =====================
function showAlert(message, title = "تنبيه") {
  playSound('wrong');
  const container = document.getElementById('modalContainer');
  if(!container) return;
  container.innerHTML = `
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3>${title}</h3>
        <p>${message}</p>
        <button class="btn green" onclick="closeModal()">حسناً</button>
      </div>
    </div>
  `;
}

function closeModal() {
  const container = document.getElementById('modalContainer');
  if(container) container.innerHTML = '';
}

// ===================== Cartoon Presets Data =====================
function fmtDesc(f){
  const lines = [];
  if(f.channel) lines.push('القناة: ' + f.channel);
  if(f.planet) lines.push('الكوكب: ' + f.planet);
  if(f.count) lines.push('عدد الشخصيات الرئيسية: ' + f.count);
  if(f.category) lines.push('التصنيف: ' + f.category);
  if(f.characters) lines.push('الشخصيات:\n' + f.characters);
  if(f.story) lines.push('القصة:\n' + f.story);
  return lines.join('\n');
}

  {name:'المحقق كونان', description:fmtDesc({channel:'سبيستون', planet:'كوكب أكشن', count:'4', category:'أنمي غموض وتحقيق', characters:'• كونان إيدوجاوا: المتحري الذكي.\n• ران موري: صديقة سينشي المخلصة.\n• توغو موري: المحقق الخاص الفكاهي.\n• الدكتور أغاسا: المخترع الجار.', story:'طالب الثانوية سينشي كودو يتحول إلى طفل صغير بعد تناوله عقاراً ساماً، فيحاول حل القضايا للوصول إلى المنظمة السوداء.'})},
  {name:'أبطال الديجيتال', description:fmtDesc({channel:'سبيستون', planet:'كوكب مغامرات', count:'4', category:'أنمي خيال علمي ومغامرات', characters:'• أمجد: قائد أبطال الديجيتال وصاحب الشجاعة.\n• يامن: الصديق المخلص والمنافس.\n• أبطال العالم الرقمي وووحوشهم.', story:'مجموعة من الأطفال ينتقلون إلى العالم الرقمي ليصبحوا أبطالاً يدافعون عنه رفقة مرافقيهم.'})},
  {name:'أبطال التايتنز', description:fmtDesc({channel:'Cartoon Network (CN)', count:'5', category:'أكشن وكوميديا', characters:'• روبن: القائد الجاد والمنظم.\n• ستارفلاير: الفتاة الفضائية اللطيفة.\n• سايبرغ: النصف آلي المحب للمرح.\n• بيست بوي: الفتى القادر على التحول للحيوانات.\n• رايفن: الفتاة الغامضة ذات القوى السحرية.', story:'فريق من الأبطال الخارقين الشباب يدافعون عن مدينتهم وخوضون مواقف كوميدية يومية.'})},
  {name:'أنا وأخي', description:fmtDesc({channel:'سبيستون', planet:'كوكب زمردة', count:'2', category:'دراما وعائلي', characters:'• سامي: الأخ الأكبر المسؤول والصادق.\n• وسيم: الطفل الصغير اللطيف والمدلل.', story:'قصة سامي الذي يتحمل مسؤولية رعاية أخيه الصغير وسيم بعد وفاة والدتهم، في مواقف مليئة بالمشاعر والعاطفة.'})},
  {name:'أنت وأنا', description:fmtDesc({channel:'براعم', count:'2', category:'تعليمي للأطفال', characters:'• شخصيات برعومية تتفاعل مع الأطفال.', story:'برنامج تعليمي تفاعلي يهدف لبناء مهارات الأطفال وتوصيل القيم البسيطة.'})},
  {name:'الأميرة والضفدع', description:fmtDesc({channel:'MBC3', count:'2', category:'فانتازيا ورومانسية', characters:'• تيانا: فتاة طموحة تحلم بافتتاح مطعمها الخاص.\n• الأمير نيفين: أمير مستهتر تحول إلى ضفدع.', story:'رحلة في أحراش المستنقع لفك لعنة السحر وتحويل الضفدع إلى أمير مجدداً.'})},
  {name:'الأسد الملك', description:fmtDesc({channel:'MBC3', count:'3', category:'دراما ومغامرة', characters:'• سيمبا: وريث عرش أراضي العزة.\n• سكار: العم الشرير الطامع بالسلطة.\n• تيمون وبومبا: الثنائي المرح صاحب شعار هاكونا ماتاتا.', story:'رحلة الشبل سيمبا للعودة واستعادة ملك أبيه بعد استيلاء عمه سكار عليه.'})},

  {name:'الفتيات الخارقات', description:fmtDesc({channel:'Cartoon Network (CN)', count:'3', category:'أكشن وكوميديا', characters:'• بلوسم: القائدة الذكية والمنظمة.\n• بابلز: الفتاة اللطيفة والمحبة للحيوانات.\n• باتركب: الفتاة القوية والعنيفة.', story:'ثلاث فتيات صغيرات ذوات قوى خارقة صُنعت بالصدفة لحماية مدينة تاونسفيل من الجريمة.'})},
  {name:'المخلب الأسود', description:fmtDesc({channel:'قناة أجيال', count:'2', category:'مغامرة وإثارة', characters:'• بطل قناع المخلب الأسود.\n• مساعد البطل والمحقق.', story:'مغامرات تشويقية لبطل مقنع يسعى لنشر العدالة وإحباط مخططات الأشرار.'})},
  {name:'المهرج تيتو', description:fmtDesc({channel:'براعم', count:'1', category:'ترفيهي وكوميدي للأطفال', characters:'• تيتو: مهرج لطيف ومرح يحب نشر البسمة.', story:'فقرات استعراضية ومواقف طريفة تهدف لتعليم الأطفال وتسلِيتهم بروح مرحة.'})},
  {name:'اب', description:fmtDesc({channel:'MBC3', count:'2', category:'مغامرة ودراما', characters:'• كارل فريدريكسن: العجوز الصارم ذو القلب الطيب.\n• راسل: مستكشف الكشافة النشيط.', story:'رحلة عجوز لتحقيق حلم زوجته بالطيران ببيته باستخدام آلاف بالونات الهيليوم.'})},
  {name:'باتمان', description:fmtDesc({channel:'سبيستون / MBC3', planet:'كوكب أكشن', count:'3', category:'أكشن وغموض', characters:'• بروس واين (باتمان): فارس الظلام.\n• ألفرد: الخادم الحكيم والمخلص.\n• الجوكر: الخصم الشرير اللدود.', story:'حماية مدينة غوثام من المجرمين والأشرار باستخدام المهارات القتالية والتقنيات العالية.'})},
  {name:'بامبي', description:fmtDesc({channel:'براعم', count:'2', category:'طبيعة ومغامرة', characters:'• بامبي: الغزال الصغير أمير الغابة.\n• ثامبر: الأرنب المرح الصديق المقرب.', story:'نشأة غزال صغير في الطبيعة وتعلّمه الدروس الحياتية وحماية سكان الغابة.'})},

// ===================== App Init & Auth =====================
function initApp(){
  loadAccount();
  renderApp();
}

function loadAccount(){
  const saved = safeStorage.getItem(USER_STORAGE_PREFIX + 'account');
  if(saved){
    try{
      account = JSON.parse(saved);
      me = {id: account.id, name: account.username};
    }catch(e){account=null;}
  }
}

function handleAuth(e){
  e.preventDefault();
  playSound('click');
  const usernameInput = document.getElementById('usernameInput').value.trim();
  const passwordInput = document.getElementById('passwordInput').value;
  if(!usernameInput || !passwordInput) return;

  let usersDb = {};
  try{
    const rawDb = safeStorage.getItem(USERS_DB_KEY);
    if(rawDb) usersDb = JSON.parse(rawDb);
  }catch(err){ usersDb = {}; }

  if(usersDb[usernameInput]){
    if(usersDb[usernameInput].password === passwordInput){
      account = usersDb[usernameInput];
    } else {
      showAlert('كلمة المرور غير صحيحة لهذا اللقب! يرجى المحاولة مجدداً.', 'تعذر تسجيل الدخول');
      return;
    }
  } else {
    account = { id: 'u_' + Math.random().toString(36).substr(2, 9), username: usernameInput, password: passwordInput };
    usersDb[usernameInput] = account;
    safeStorage.setItem(USERS_DB_KEY, JSON.stringify(usersDb));
  }

  safeStorage.setItem(USER_STORAGE_PREFIX + 'account', JSON.stringify(account));
  me = {id: account.id, name: account.username};
  renderApp();
}

function logout(){
  playSound('click');
  account = null;
  me = null;
  roomCode = null;
  state = null;
  if(pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  safeStorage.removeItem(USER_STORAGE_PREFIX + 'account');
  renderApp();
}

function openProfile(){
  playSound('click');
  showAlert(`اسم الحساب: ${me.name}\nمعرف اللاعب: ${me.id}`, 'الملف الشخصي 👤');
}

// ===================== Render / UI =====================
function renderApp(){
  const app = document.getElementById('app');
  if(!app) return;

  if(!account){
    app.innerHTML = `
      <div class="auth-hero">
        <h1 class="logo">🎨 خمّن <span>الكرتون</span></h1>
        <p class="tagline">لعبة تحدي ذكريات الطفولة والرسوم المتحركة</p>
      </div>
      <div class="panel">
        <form onsubmit="handleAuth(event)">
          <label>اسم اللقب (الاسم المستعار)</label>
          <input type="text" id="usernameInput" placeholder="أدخل اسمك هنا..." autocomplete="off" required>
          <label>كلمة المرور</label>
          <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور..." required>
          <button type="submit" class="btn green" style="margin-top:6px;">دخول / تسجيل</button>
        </form>
      </div>
    `;
    return;
  }

  if(!roomCode){
    if(pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    app.innerHTML = `
      <div class="auth-hero" style="margin-bottom:14px; padding:18px;">
        <h1 class="logo" style="font-size:2.4rem;">🎨 خمّن <span>الكرتون</span></h1>
        <p class="tagline">• لعبة جماعية أونلاين لحزر الكراتين •</p>
      </div>

      <div class="welcome-banner">
        👋 مرحبا ${me.name}.
      </div>

      <div class="menu-grid">
        <button class="menu-box-btn red" onclick="logout()">
          تسجيل خروج 🚪
        </button>
        <button class="menu-box-btn blue" onclick="openProfile()">
          الملف الشخصي 👤
        </button>
        <button class="menu-box-btn ${entryMode==='join'?'blue':''}" onclick="entryMode='join';renderApp()">
          الانضمام لغرفة 🚪
        </button>
        <button class="menu-box-btn ${entryMode==='create'?'blue':''}" onclick="entryMode='create';renderApp()">
          إنشاء غرفة ➕
        </button>
      </div>

      <div class="panel" style="padding:20px;">
        ${entryMode === 'create' ? `
          <label>عدد اللاعبين</label>
          <select id="maxPlayersSelect">
            <option value="2">2 لاعبين</option>
            <option value="3" selected>3 لاعبين</option>
            <option value="4">4 لاعبين</option>
            <option value="5">5 لاعبين</option>
            <option value="6">6 لاعبين</option>
          </select>
          <button class="btn yellow" onclick="createRoom()" style="margin-top:4px;">أنشئ الغرفة</button>
        ` : `
          <label>كود الغرفة</label>
          <input type="text" id="roomCodeInput" placeholder="مثال: TOON1" style="text-transform:uppercase; text-align:center; letter-spacing:2px;" autocomplete="off">
          <button class="btn yellow" onclick="joinRoom()" style="margin-top:4px;">ادخل الغرفة</button>
        `}
      </div>
    `;
    return;
  }

  if(!pollTimer) pollTimer = setInterval(pollRoom, 1500);

  if(!state){
    app.innerHTML = `<div class="panel"><div class="waiting-msg">جاري تحميل الغرفة...</div></div>`;
    return;
  }

  const isUploader = state.uploader && state.uploader.id === me.id;

  if(state.status === 'lobby'){
    app.innerHTML = `
      <div class="top-header-row">
        <button class="menu-box-btn red" style="padding:6px 14px; font-size:0.85rem;" onclick="leaveRoom()">خروج 🚪</button>
        <h1 class="logo" style="font-size:2rem; margin:0;">🎨 خمّن <span>الكرتون</span></h1>
      </div>
      <div class="panel center">
        <p style="font-weight:700; margin:0;">كود الغرفة</p>
        <div class="code-badge">${roomCode}</div>
        <p style="font-weight:700; font-size:0.95rem; margin:6px 0 14px; color:#555;">${state.players.length} / ${state.maxPlayers} لاعبين</p>
        
        <div style="background:var(--pop-yellow); border:2.5px solid var(--ink); border-radius:12px; padding:10px; font-weight:700; font-size:0.95rem; display:inline-block; box-shadow:3px 3px 0 var(--ink); margin-bottom:14px;">
          🎨 0 🏆 1 ${me.name}
        </div>

        <div class="divider"></div>
        ${isUploader ? `
          <button class="btn green" onclick="goToSetup()">بدء اختيار الكرتون 🎨</button>
        ` : `
          <div class="waiting-msg">بانتظار أن يقوم المنشئ باختيار الكرتون والصورة...</div>
        `}
      </div>
    `;
    return;
  }

  if(state.status === 'setup' && isUploader){
    let channelsList = ["سبيستون", "Cartoon Network (CN)", "براعم", "MBC3", "قناة أجيال"];
    app.innerHTML = `
      <div class="top-header-row">
        <button class="menu-box-btn red" style="padding:6px 14px; font-size:0.85rem;" onclick="leaveRoom()">خروج 🚪</button>
        <h1 class="logo" style="font-size:2rem; margin:0;">🎨 خمّن <span>الكرتون</span></h1>
      </div>

      <div class="panel center" style="padding:14px; margin-bottom:14px;">
        <p style="font-weight:700; margin:0;">كود الغرفة</p>
        <div class="code-badge" style="font-size:1.4rem; padding:4px 14px;">${roomCode}</div>
        <p style="font-weight:700; font-size:0.9rem; margin:4px 0 8px; color:#555;">${state.players.length} / ${state.maxPlayers} لاعبين</p>
        <div style="background:var(--pop-yellow); border:2.5px solid var(--ink); border-radius:12px; padding:8px; font-weight:700; font-size:0.9rem; display:inline-block; box-shadow:3px 3px 0 var(--ink);">
          🎨 0 🏆 1 ${me.name}
        </div>
      </div>

      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <button class="badge-tag" style="background:var(--ink); color:#fff; font-size:0.8rem; padding:4px 10px;">الجولة 1 🎬</button>
          <span style="font-weight:700; font-size:0.9rem;">دورك ترفع كرتون</span>
        </div>

        <label style="text-align:right;">اسم الكرتون (الحل)</label>
        
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          ${draftCartoonName ? `
            <div style="flex:1; background:var(--pop-green); color:#fff; border:2.5px solid var(--ink); border-radius:10px; padding:10px; font-weight:700; display:flex; justify-content:space-between; align-items:center; box-shadow:3px 3px 0 var(--ink);">
              <span>✓ ${draftCartoonName}</span>
              <button onclick="clearCartoonSelection()" style="background:var(--pop-red); color:#fff; border:1.5px solid var(--ink); border-radius:8px; padding:2px 8px; cursor:pointer; font-weight:700; font-size:0.8rem;">إلغاء الاختيار ✕</button>
            </div>
          ` : `
            <div style="flex:1; background:var(--paper); border:2.5px solid var(--ink); border-radius:10px; padding:10px; font-weight:700; color:#777; text-align:center; box-shadow:3px 3px 0 var(--ink);">
              ما اخترت كرتون بعد
            </div>
          `}
        </div>

        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <button class="btn blue small" style="flex:1; font-size:0.9rem;" onclick="toggleSetupMode('presets')">📺 القنوات (فهرس القنوات)</button>
          <button class="btn blue small" style="flex:1; font-size:0.9rem; background:#333;" onclick="toggleSetupMode('custom')">+ كرتون من عندي</button>
        </div>

        ${setupMode === 'presets' ? `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label style="margin:0;">اختر القناة لعرض كراتينها:</label>
          </div>
          <div class="cartoon-picks" style="margin-bottom:10px;">
            ${channelsList.map(ch => `
              <div class="cartoon-chip ${selectedChannel===ch?'selected':''}" onclick="selectChannel('${ch}')">${ch}</div>
            `).join('')}
          </div>
          ${selectedChannel ? `
            <div style="font-weight:700; font-size:0.9rem; color:var(--pop-blue); margin-bottom:6px; text-align:right;">كراتين قناة ${selectedChannel}:</div>
            <div class="cartoon-picks" style="max-height:220px; overflow-y:auto; padding:4px;">
              ${CARTOON_PRESETS.filter(c => c.description.includes('القناة: ' + selectedChannel) || (selectedChannel==='سبيستون' && c.description.includes('سبيستون'))).map(c => `
                <div class="cartoon-chip ${draftCartoonName===c.name?'selected':''}" onclick="selectPresetCartoon('${c.name}')">${c.name}</div>
              `).join('')}
            </div>
          ` : ''}
          <div class="divider"></div>
        ` : ''}

        ${setupMode === 'custom' ? `
          <input type="text" id="customNameField" placeholder="اكتب اسم الكرتون..." value="${customNameInputVal}" oninput="customNameInputVal=this.value" autocomplete="off">
          <textarea id="customDescField" rows="4" placeholder="وصف الكرتون (اختياري) — مثال:\nالقناة\nالكوكب (إذا كان من سبيستون)\nعدد الشخصيات الرئيسية\nالتصنيف\nالشخصيات\nالقصة" oninput="customDescInputVal=this.value">${customDescInputVal}</textarea>
          <button class="btn green small" onclick="saveCustomCartoon()" style="margin-bottom:12px;">إضافة</button>
          <div class="divider"></div>
        ` : ''}

        ${draftCartoonName ? `
          <label style="text-align:right;">صورة التحدي (اختياري)</label>
          <div class="file-drop ${customImageData?'has-img':''}" onclick="document.getElementById('fileInput').click()">
            ${customImageData ? `<img src="${customImageData}">` : `<span>📷 اضغط لرفع صورة الكرتون (اختياري)</span>`}
          </div>
          <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
        ` : ''}

        ${draftDescription && setupMode !== 'custom' ? `
          <div class="desc-card">${draftDescription}</div>
        ` : ''}

        <button class="btn green" style="margin-top:6px;" onclick="publishGame()">انشر السؤال</button>
      </div>
    `;
    return;
  }

  if(state.status === 'playing'){
    const myGuessObj = state.guesses ? state.guesses.find(g => g.playerId === me.id) : null;
    app.innerHTML = `
      <div class="top-header-row">
        <button class="menu-box-btn red" style="padding:6px 14px; font-size:0.85rem;" onclick="leaveRoom()">خروج 🚪</button>
        <h1 class="logo" style="font-size:2rem; margin:0;">🎨 خمّن <span>الكرتون</span></h1>
      </div>

      <div class="panel center" style="padding:14px; margin-bottom:14px;">
        <p style="font-weight:700; margin:0;">كود الغرفة</p>
        <div class="code-badge" style="font-size:1.4rem; padding:4px 14px;">${roomCode}</div>
        <p style="font-weight:700; font-size:0.9rem; margin:4px 0 8px; color:#555;">${state.players.length} / ${state.maxPlayers} لاعبين</p>
        <div style="background:var(--pop-yellow); border:2.5px solid var(--ink); border-radius:12px; padding:8px; font-weight:700; font-size:0.9rem; display:inline-block; box-shadow:3px 3px 0 var(--ink);">
          🎨 0 🏆 1 ${me.name}
        </div>
      </div>

      <div class="panel">
        ${state.imageUrl ? `
          <div class="game-img-wrap">
            <img src="${state.imageUrl}">
          </div>
        ` : ''}
        
        <div class="desc-card">${state.description}</div>

        <div class="divider"></div>
        ${isUploader ? `
          <div style="font-weight:700; margin-bottom:10px; color:var(--pop-blue); text-align:right;">الحل عندك: <span style="color:var(--ink);">${state.cartoonName}</span></div>
          <div class="divider"></div>
          <div style="text-align:center; font-weight:700; color:#666; margin-bottom:10px;">بانتظار التخمينات...</div>
          ${(state.guesses||[]).map(g => `
            <div class="guess-item">
              <div>
                <span style="font-weight:800; color:var(--pop-blue);">${g.playerName}:</span> 
                <span class="guess-text ${g.status}">${g.text}</span>
              </div>
              <div class="verdict-btns">
                ${g.status==='pending' ? `
                  <button class="btn green small" onclick="verdictGuess('${g.playerId}', 'correct')">صح ✅</button>
                  <button class="btn red small" onclick="verdictGuess('${g.playerId}', 'wrong')">خطأ ❌</button>
                ` : `
                  <span class="badge-tag">${g.status==='correct'?'صحيح ✅':'خاطئ ❌'}</span>
                `}
              </div>
            </div>
          `).join('')}
        ` : `
          ${myGuessObj ? `
            <div style="text-align:center; font-weight:700; margin-bottom:14px;">
              تخمينك الحالي: <span style="color:var(--pop-blue);">${myGuessObj.text}</span>
              <div style="margin-top:6px;"><span class="badge-tag">${myGuessObj.status==='pending'?'بانتظار تقييم المنشئ...':(myGuessObj.status==='correct'?'إجابة صحيحة! 🎉':'إجابة خاطئة ❌')}</span></div>
            </div>
            ${myGuessObj.status==='wrong' ? `
              <button class="btn blue" onclick="resetMyGuess()">محاولة تخمين جديدة 🔄</button>
            ` : ''}
          ` : `
            <label>ما هو اسم هذا الكرتون؟</label>
            <input type="text" id="myGuessInput" placeholder="اكتب تخمينك هنا..." autocomplete="off">
            <button class="btn yellow" onclick="submitGuess()">إرسال التخمين 🎯</button>
          `}
        `}
      </div>
    `;
    return;
  }
}

// ===================== Room Actions =====================
function createRoom(){
  playSound('click');
  const maxP = document.getElementById('maxPlayersSelect')?.value || 3;
  roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
  state = {
    code: roomCode,
    status: 'lobby',
    maxPlayers: parseInt(maxP),
    uploader: me,
    players: [me],
    cartoonName: '',
    imageUrl: '',
    description: '',
    guesses: []
  };
  saveState();
  renderApp();
}

let selectedChannel = null;

function selectChannel(ch){
  playSound('click');
  selectedChannel = ch;
  renderApp();
}

function joinRoom(){
  playSound('click');
  const codeInput = document.getElementById('roomCodeInput');
  if(!codeInput) return;
  const code = codeInput.value.trim().toUpperCase();
  if(!code) return;
  const raw = safeStorage.getItem(STORAGE_PREFIX + code);
  if(!raw){
    showAlert('لم يتم العثور على غرفة بهذا الرمز! تأكد من صحة الرمز.', 'خطأ بالانضمام');
    return;
  }
  try{
    const loaded = JSON.parse(raw);
    if(!loaded.players.some(p => p.id === me.id)){
      if(loaded.players.length >= (loaded.maxPlayers || 6)){
        showAlert('عذراً، الغرفة ممتلئة بالكامل!', 'غرفة ممتلئة');
        return;
      }
      loaded.players.push(me);
    }
    roomCode = code;
    state = loaded;
    saveState();
    renderApp();
  }catch(e){
    showAlert('حدث خطأ أثناء قراءة بيانات الغرفة.', 'خطأ');
  }
}

function leaveRoom(){
  playSound('click');
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  if(state && state.players){
    state.players = state.players.filter(p => p.id !== me.id);
    if(state.players.length === 0){
      safeStorage.removeItem(STORAGE_PREFIX + roomCode);
    } else {
      if(state.uploader && state.uploader.id === me.id){
        state.uploader = state.players[0];
      }
      saveState();
    }
  }
  roomCode = null;
  state = null;
  renderApp();
}

// ===================== Sync (Polling & Save) =====================
function pollRoom(){
  if(!roomCode) return;
  const raw = safeStorage.getItem(STORAGE_PREFIX + roomCode);
  if(!raw){
    showAlert('تم إنهاء الغرفة بواسطة المنشئ.', 'تنبيه');
    roomCode = null;
    state = null;
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    renderApp();
    return;
  }
  try{
    const loaded = JSON.parse(raw);
    if(JSON.stringify(state) !== JSON.stringify(loaded)){
      state = loaded;
      renderApp();
    }
  }catch(e){}
}

function saveState(){
  if(!roomCode || !state) return;
  safeStorage.setItem(STORAGE_PREFIX + roomCode, JSON.stringify(state));
}

// ===================== Setup & Cartoon Selection =====================
function goToSetup(){
  playSound('click');
  state.status = 'setup';
  setupMode = 'none';
  selectedChannel = null;
  saveState();
  renderApp();
}

function toggleSetupMode(mode){
  playSound('click');
  setupMode = setupMode === mode ? 'none' : mode;
  renderApp();
}

function selectPresetCartoon(name){
  playSound('click');
  draftCartoonName = name;
  const preset = CARTOON_PRESETS.find(p => p.name === name);
  if(preset){
    draftDescription = preset.description;
  }
  setupMode = 'none';
  renderApp();
}

function clearCartoonSelection(){
  playSound('click');
  draftCartoonName = null;
  draftDescription = null;
  customImageData = null;
  renderApp();
}

function saveCustomCartoon(){
  playSound('click');
  if(!customNameInputVal.trim()){
    showAlert('يرجى كتابة اسم الكرتون المخصص أولاً!', 'تنبيه');
    return;
  }
  draftCartoonName = customNameInputVal.trim();
  draftDescription = customDescInputVal.trim() || 'لا توجد معلومات إضافية.';
  setupMode = 'none';
  renderApp();
}

function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    customImageData = evt.target.result;
    renderApp();
  };
  reader.readAsDataURL(file);
}

// ===================== Gameplay Actions =====================
function publishGame(){
  playSound('click');
  if(!draftCartoonName){
    showAlert('يرجى اختيار أو إدخال اسم الكرتون (الحل) أولاً!', 'بيانات ناقصة');
    return;
  }
  state.cartoonName = draftCartoonName;
  state.imageUrl = customImageData || '';
  state.description = draftDescription || 'لا توجد معلومات إضافية.';
  state.status = 'playing';
  state.guesses = [];
  saveState();
  renderApp();
}

function submitGuess(){
  playSound('click');
  const input = document.getElementById('myGuessInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  if(!state.guesses) state.guesses = [];
  state.guesses.push({
    playerId: me.id,
    playerName: me.name,
    text: text,
    status: 'pending'
  });
  saveState();
  renderApp();
}

function resetMyGuess(){
  playSound('click');
  if(!state.guesses) return;
  state.guesses = state.guesses.filter(g => g.playerId !== me.id);
  saveState();
  renderApp();
}

function verdictGuess(playerId, verdict){
  if(verdict === 'correct') {
    playSound('correct');
  } else {
    playSound('wrong');
  }
  if(!state.guesses) return;
  const guess = state.guesses.find(g => g.playerId === playerId);
  if(guess){
    guess.status = verdict;
    saveState();
    renderApp();
  }
}
</script>
</body>
